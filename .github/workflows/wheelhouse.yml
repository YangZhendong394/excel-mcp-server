name: Build Runtime Wheelhouse

on:
  push:
    branches: [workbuddy-adaptation]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "runtime-lock.json"
      - "scripts/start_server.py"
      - "scripts/build_wheelhouse.py"
      - ".github/workflows/wheelhouse.yml"
  release:
    types: [published]

permissions: {}

jobs:
  build-wheelhouse:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv build --wheel
      - run: uv run --with pip python scripts/build_wheelhouse.py --dist-dir dist --output-dir dist/wheelhouse
      - name: Install only from wheelhouse and verify MCP handshake
        run: uv run python scripts/test_offline_wheelhouse.py --wheelhouse dist/wheelhouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workbuddy-wheelhouse-windows-amd64-cp313
          path: dist/wheelhouse-windows-amd64-cp313-*.zip
          if-no-files-found: error
          retention-days: 30

  attach-release-asset:
    if: github.event_name == 'release'
    needs: build-wheelhouse
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: workbuddy-wheelhouse-windows-amd64-cp313
          path: dist/
      - name: Attach the wheelhouse to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.zip --repo "$GITHUB_REPOSITORY"
